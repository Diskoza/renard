[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["web/vendor", "data", "workspace", "bench/results", "eval/results"]

[tool.ruff.lint]
select = ["F", "E9", "PLE", "B023"]

[tool.ruff.lint.per-file-ignores]
"plugins/*/skills/*/script.py" = ["F821"]
"agent/voice.py" = ["B023"]
