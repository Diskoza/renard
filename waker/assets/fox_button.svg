<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
 <defs>
  <radialGradient id="bg" cx="50%" cy="38%" r="65%">
   <stop offset="0" stop-color="#34245e"/><stop offset=".6" stop-color="#1c1438"/><stop offset="1" stop-color="#0e0a1f"/>
  </radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#FFB27A"/><stop offset=".5" stop-color="#D97757"/><stop offset="1" stop-color="#8E5BD6"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
   <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
 </defs>
 <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
 <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="9"/>
 <circle cx="256" cy="256" r="218" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>
 <g fill="none" stroke-linejoin="miter" stroke-miterlimit="12" stroke-linecap="butt" filter="url(#glow)">
  <!-- head outline: sharp ears, cheek fluff, pointed chin -->
  <path stroke="#FF9A5C" stroke-width="11"
   d="M150 112 L214 204 L256 192 L298 204 L362 112 L376 246 L414 296 L326 316 L256 398 L186 316 L98 296 L136 246 Z"/>
  <!-- inner ears -->
  <path stroke="#FFD2B0" stroke-width="6" d="M164 150 L200 206 M348 150 L312 206"/>
  <!-- mask: cheeks to the nose -->
  <path stroke="#FFD2B0" stroke-width="6" d="M136 246 L222 298 L256 368 L290 298 L376 246"/>
  <!-- eyes: thin slanted blades -->
  <path stroke="#FFD2B0" stroke-width="7" d="M190 262 L232 284 M322 262 L280 284"/>
 </g>
 <!-- nose -->
 <path fill="#FF9A5C" d="M243 368 L269 368 L256 386 Z"/>
 <!-- tiny power mark under the chin -->
 <g fill="none" stroke="#FFD2B0" stroke-opacity=".85" stroke-width="5" stroke-linecap="round">
  <path d="M241 426 A18 18 0 1 0 271 426"/><path d="M256 412 L256 432"/>
 </g>
</svg>