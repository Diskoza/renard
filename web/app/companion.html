<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Renard companion</title>
<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/",
               "@pixiv/three-vrm": "/vendor/three/three-vrm.module.min.js" } }
</script>
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; user-select:none; font:13px/1.4 "Segoe UI", sans-serif; }
  #stage { position:absolute; inset:0; cursor:grab; }
  body[data-mode=drag] #stage { cursor:grabbing; }
  canvas { width:100%; height:100%; display:block; }
  .av2d-wrap { position:absolute; inset:0; }
  .avatar2d { position:absolute; left:50%; bottom:34px; max-height:72%; max-width:88%; object-fit:contain; transform-origin:50% 100%; pointer-events:none; }
  .av-badge { position:absolute; left:50%; top:8%; transform:translateX(-50%) scale(.6); font-size:30px; opacity:0; transition:.25s; pointer-events:none; }
  .av-badge.on { opacity:1; transform:translateX(-50%) scale(1); }
  .bubble { position:absolute; left:12px; width:max-content; max-width:min(290px, calc(100% - 24px)); top:6px; padding:8px 11px; border-radius:14px; background:rgba(30,29,28,.92); color:#ECEAE6;
    border:1px solid rgba(217,119,87,.45); opacity:0; transition:opacity .3s; max-height:78px; overflow:hidden; pointer-events:none; }
  .bubble.on { opacity:1; }
  #px { position:absolute; right:0; bottom:26px; display:none; image-rendering:pixelated; cursor:grab; }
  body.pixel #px { display:block; }
  body.pixel #stage { display:none; }
  #menu { position:absolute; display:none; grid-auto-flow:row; grid-template-columns:max-content; gap:1px; min-width:170px; padding:5px; border-radius:12px; background:rgba(30,29,28,.97);
    border:1px solid #3a3836; box-shadow:0 10px 30px rgba(0,0,0,.5); z-index:5; }
  #menu.on { display:grid; }
  #menu.compact button { padding:4px 10px; font-size:12.5px; }
  #menu button { all:unset; padding:7px 10px; border-radius:8px; color:#ECEAE6; cursor:pointer; white-space:nowrap; }
  #menu button:hover { background:#D97757; color:#141312; }
</style>
</head>
<body data-mode="stand">
<div id="stage"></div>
<canvas id="px"></canvas>
<div class="bubble" id="bubble"></div>
<div id="menu"></div>
<script type="module" src="/app/companion.js"></script>
</body>
</html>
