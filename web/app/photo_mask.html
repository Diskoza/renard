<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renard — что перерисовать</title>
<style>
  :root { --bg:#0e0f14; --panel:#181a22; --line:#2a2d3a; --text:#e6e7ee; --dim:#9a9db0; --acc:#7c6cff; --paint:255,64,96; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI", sans-serif; }
  header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:10px 14px; background:var(--panel);
           border-bottom:1px solid var(--line); position:sticky; top:0; z-index:2; }
  header b { margin-right:6px; }
  button { background:#242735; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 12px;
           cursor:pointer; font:inherit; }
  button.on { border-color:var(--acc); background:#2c2850; }
  button.main { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:600; }
  label { color:var(--dim); display:flex; gap:6px; align-items:center; }
  #msg { color:var(--dim); margin-left:auto; }
  #wrap { position:relative; margin:14px auto; width:max-content; max-width:calc(100vw - 28px); }
  #wrap img, #wrap canvas { display:block; max-width:calc(100vw - 28px); max-height:calc(100vh - 90px); }
  #wrap canvas { position:absolute; inset:0; width:100%; height:100%; cursor:crosshair; touch-action:none; }
</style>
</head>
<body>
<header>
  <b>Закрась кистью, что перерисовать</b>
  <button id="brush" class="on">Кисть</button>
  <button id="erase">Ластик</button>
  <label>размер <input id="size" type="range" min="4" max="160" value="40"></label>
  <button id="undo">Отменить</button>
  <button id="clear">Очистить</button>
  <button id="save" class="main">Сохранить</button>
  <span id="msg">Закрашивай с запасом — чуть шире самой руки / предмета.</span>
</header>
<div id="wrap"><img id="img" alt=""><canvas id="cv"></canvas></div>
<script>
const path = new URLSearchParams(location.search).get('path') || '';
const img = document.getElementById('img'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const msg = t => document.getElementById('msg').textContent = t;
let erase = false, down = false, last = null, hist = [];
img.onload = () => { cv.width = img.naturalWidth; cv.height = img.naturalHeight; };
img.onerror = () => msg('Не открылось фото: ' + path);
img.src = '/api/photo/file?path=' + encodeURIComponent(path);
const k = () => cv.width / cv.getBoundingClientRect().width;
const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * k(), (e.clientY - r.top) * k()]; };
function stroke(a, b) {
  ctx.globalCompositeOperation = erase ? 'destination-out' : 'source-over';
  ctx.strokeStyle = 'rgb(255,64,96)';
  ctx.lineWidth = +document.getElementById('size').value * k(); ctx.lineCap = ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
}
cv.style.opacity = .55;
cv.onpointerdown = e => { down = true; cv.setPointerCapture(e.pointerId); hist.push(ctx.getImageData(0, 0, cv.width, cv.height));
  if (hist.length > 20) hist.shift(); last = pos(e); stroke(last, last); };
cv.onpointermove = e => { if (!down) return; const p = pos(e); stroke(last, p); last = p; };
cv.onpointerup = cv.onpointercancel = () => { down = false; };
const sel = on => { erase = on; document.getElementById('brush').classList.toggle('on', !on); document.getElementById('erase').classList.toggle('on', on); };
document.getElementById('brush').onclick = () => sel(false);
document.getElementById('erase').onclick = () => sel(true);
document.getElementById('undo').onclick = () => { const h = hist.pop(); if (h) ctx.putImageData(h, 0, 0); };
document.getElementById('clear').onclick = () => { hist.push(ctx.getImageData(0, 0, cv.width, cv.height)); ctx.clearRect(0, 0, cv.width, cv.height); };
document.getElementById('save').onclick = async () => {
  msg('Сохраняю…');
  const r = await fetch('/api/photo/mask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, png: cv.toDataURL('image/png') }) });
  const j = await r.json().catch(() => ({}));
  msg(r.ok ? 'Сохранено. Напиши Renard: «перерисуй» — и что должно быть на этом месте.' : ('Ошибка: ' + (j.error || r.status)));
};
</script>
</body>
</html>
